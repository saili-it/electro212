services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: electro212
    ports:
      - "5432:5432"
    volumes:
      - electro212_pgdata:/var/lib/postgresql/data

volumes:
  electro212_pgdata:
