# Production stack: Next.js app + PostgreSQL.
# Create a `.env` next to this file first (see DEPLOY.md) with at least:
#   POSTGRES_PASSWORD=...   AUTH_SECRET=...   SITE_URL=https://votre-domaine.ma
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-electro212}
    volumes:
      - electro212_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-electro212}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connects to the `db` service over the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-electro212}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Définissez AUTH_SECRET dans .env}
      SITE_URL: ${SITE_URL:?Définissez SITE_URL dans .env}
      # Image storage. Default "local" → disk, persisted in the electro212_uploads volume.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_CDN_URL: ${STORAGE_PUBLIC_CDN_URL:-}
    ports:
      - "3000:3000"
    volumes:
      # Keeps uploaded product images across restarts (local storage adapter).
      - electro212_uploads:/app/.data

volumes:
  electro212_pgdata:
  electro212_uploads:
